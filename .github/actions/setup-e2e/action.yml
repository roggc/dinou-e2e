name: Setup E2E
description: Setup Node, optional runtimes (Deno, Bun), dependencies and Playwright browsers

inputs:
  deno:
    description: Install Deno
    default: 'false'
  bun:
    description: Install Bun
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm

    - name: Setup Deno
      if: inputs.deno == 'true'
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Setup Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

    - name: Configure APT mirror & timeouts (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # En Ubuntu 24.04 (Noble), los runners de GitHub usan mirror+file:/etc/apt/apt-mirrors.txt
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
        fi
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
        sudo tee /etc/apt/apt.conf.d/99custom >/dev/null << 'EOF'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::ForceIPv4 "true";
        DPkg::Lock::Timeout "120";
        EOF
        sudo apt-get update -y

    - name: Install Playwright OS Dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for i in 1 2 3; do
          echo "Intento $i: Instalando dependencias de Playwright para Linux..."
          if timeout 420 npx playwright install-deps; then
            echo "Dependencias de Playwright instaladas correctamente."
            exit 0
          fi
          echo "::warning::install-deps intento $i falló o se colgó; reintentando..."
          sudo dpkg --configure -a || true
          sleep 15
        done
        echo "Error: install-deps falló tras 3 intentos."
        exit 1

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install
