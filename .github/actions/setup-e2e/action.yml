name: Setup E2E
description: Setup Node, optional runtimes (Deno, Bun), dependencies and Playwright browsers

inputs:
  deno:
    description: Install Deno
    default: 'false'
  bun:
    description: Install Bun
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: npm

    - name: Setup Deno
      id: setup-deno
      if: inputs.deno == 'true'
      continue-on-error: true
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x
        cache: true

    - name: Fallback Setup Deno via npm
      if: inputs.deno == 'true' && steps.setup-deno.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::denoland/setup-deno falló (p. ej. 504 en GitHub Releases); instalando Deno vía npm..."
        npm install -g deno@latest
        NPM_PREFIX="$(npm config get prefix)"
        if [ -d "$NPM_PREFIX/bin" ]; then
          echo "$NPM_PREFIX/bin" >> "$GITHUB_PATH"
        else
          echo "$NPM_PREFIX" >> "$GITHUB_PATH"
        fi
        deno --version

    - name: Setup Bun
      id: setup-bun
      if: inputs.bun == 'true'
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Fallback Setup Bun via npm
      if: inputs.bun == 'true' && steps.setup-bun.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::oven-sh/setup-bun falló (p. ej. 504 en GitHub Releases); instalando Bun vía npm..."
        npm install -g bun@latest
        NPM_PREFIX="$(npm config get prefix)"
        if [ -d "$NPM_PREFIX/bin" ]; then
          echo "$NPM_PREFIX/bin" >> "$GITHUB_PATH"
        else
          echo "$NPM_PREFIX" >> "$GITHUB_PATH"
        fi
        bun --version

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/ms-playwright
          ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

    - name: Configure APT mirror & timeouts (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # En Ubuntu 24.04 (Noble), los runners de GitHub usan mirror+file:/etc/apt/apt-mirrors.txt.
        # Configuramos una lista de mirrors CDN de alta velocidad en EE. UU. con failover automático
        # (evitando enviar los 19 jobs en paralelo únicamente a archive.ubuntu.com en UK, que aplica throttling a ~25 kB/s).
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' \
            "http://azure.archive.ubuntu.com/ubuntu/" \
            "https://mirrors.edge.kernel.org/ubuntu/" \
            "http://mirrors.ocf.berkeley.edu/ubuntu/" \
            "http://us.archive.ubuntu.com/ubuntu/" \
            "http://archive.ubuntu.com/ubuntu/" \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        # Desactivar noble-backports (Playwright no lo necesita y suele colgarse en mirrors secundarios)
        sudo sed -i 's/noble-backports//g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
        sudo tee /etc/apt/apt.conf.d/99custom >/dev/null << 'EOF'
        Acquire::Retries "3";
        Acquire::http::Timeout "10";
        Acquire::https::Timeout "10";
        Acquire::http::Pipeline-Depth "0";
        Acquire::ForceIPv4 "true";
        APT::Get::Assume-Yes "true";
        DPkg::Lock::Timeout "60";
        Dpkg::Options {
          "--force-confdef";
          "--force-confold";
        };
        EOF

    - name: Install Playwright OS Dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for i in 1 2 3; do
          echo "Intento $i: Instalando dependencias de Playwright para Linux..."
          if timeout 420 npx playwright install-deps; then
            echo "Dependencias de Playwright instaladas correctamente."
            exit 0
          fi
          echo "::warning::install-deps intento $i falló o se colgó; limpiando procesos apt/dpkg huérfanos y reintentando..."
          # npx playwright install-deps lanza 'sudo -- sh -c "apt-get update && apt-get install ..."'.
          # Cuando 'timeout' (usuario runner) mata a npx, NO tiene permisos para matar al hijo 'apt-get' (usuario root),
          # dejándolo vivo en segundo plano y reteniendo /var/lib/dpkg/lock-frontend en los intentos 2 y 3.
          sudo killall -9 apt apt-get dpkg 2>/dev/null || true
          sleep 2
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
          sleep 10
        done
        echo "Error: install-deps falló tras 3 intentos."
        exit 1

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install
