name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.os }} - ${{ matrix.runtime.name }} - ${{ matrix.bundler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        bundler: [esbuild, rollup, webpack]
        runtime:
          - { id: node-dev,   name: Node DEV,          build: '',                 start: 'npm run dev',                  start_bundler: true,  deno: false, bun: false }
          - { id: node-aot,   name: Node AOT,          build: 'build:node',       start: 'npm run start:node',           start_bundler: true,  deno: false, bun: false }
          - { id: cloudflare, name: Cloudflare Worker, build: 'build:cloudflare', start: 'npx wrangler dev --port 3000', start_bundler: false, deno: false, bun: false }
          - { id: deno,       name: Deno,              build: 'build:deno',       start: 'npm run start:deno',           start_bundler: false, deno: true,  bun: false }
          - { id: bun,        name: Bun,               build: 'build:bun',        start: 'npm run start:bun',            start_bundler: true,  deno: false, bun: true  }
          - { id: bun-pure,   name: Bun Pure,          build: 'build:bun:pure',   start: 'npm run start:bun',            start_bundler: true,  deno: false, bun: true  }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Environment & Dependencies
        uses: ./.github/actions/setup-e2e
        with:
          deno: ${{ matrix.runtime.deno }}
          bun: ${{ matrix.runtime.bun }}

      - name: Build (${{ matrix.runtime.name }} / ${{ matrix.bundler }})
        if: matrix.runtime.build != ''
        run: npm run ${{ matrix.runtime.build }}:${{ matrix.bundler }}

      - name: Run Playwright tests
        env:
          TEST_CMD: ${{ matrix.runtime.start_bundler && format('{0}:{1}', matrix.runtime.start, matrix.bundler) || matrix.runtime.start }}
          PORT: 3000
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.os }}-${{ matrix.runtime.id }}-${{ matrix.bundler }}
          path: playwright-report/
          retention-days: 30
