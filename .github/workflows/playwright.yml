name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  dev-tests:
    name: ${{ matrix.os }} - Node DEV - ${{ matrix.bundler }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        bundler: [webpack, rollup, esbuild]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - name: Fix slow Ubuntu APT mirrors & set timeouts
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          sudo sh -c 'echo "Acquire::http::Timeout \"15\";\nAcquire::http::Retries \"3\";" > /etc/apt/apt.conf.d/99timeout'
      - name: Install Playwright Browsers & Deps
        timeout-minutes: 20
        run: npx playwright install --with-deps

      - name: Run Playwright Tests (Dev Mode)
        env:
          TEST_CMD: npm run dev:${{ matrix.bundler }}
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.os }}-node-dev-${{ matrix.bundler }}
          path: playwright-report/
          retention-days: 30

  cloudflare-tests:
